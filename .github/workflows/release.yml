name: Release

on:
  push:
    tags: ["v*"]

# Release assets are published only after all supported platforms produce a
# minisign-signed updater package. This detached updater signature is separate
# from macOS code signing. It is safe to rerun a failed release: uploads replace
# an existing asset with the same name.
permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag matches the Cargo workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "siffra-desktop") | .version')"
          test "v$version" = "$GITHUB_REF_NAME"

  package:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            formats: app,dmg
            platform: macos-x86_64
            updater_format: app
            updater_glob: '*.app.tar.gz'
            updater_asset: Siffra-macos-x86_64.app.tar.gz
            installer_glob: '*.dmg'
          - os: macos-15
            formats: app,dmg
            platform: macos-aarch64
            updater_format: app
            updater_glob: '*.app.tar.gz'
            updater_asset: Siffra-macos-aarch64.app.tar.gz
            installer_glob: '*.dmg'
          - os: windows-2025
            formats: nsis,wix
            platform: windows-x86_64
            updater_format: nsis
            updater_glob: '*-setup.exe'
            updater_asset: Siffra-windows-x86_64-setup.exe
            installer_glob: '*.msi'
          - os: ubuntu-22.04
            formats: appimage,deb
            platform: linux-x86_64
            updater_format: appimage
            updater_glob: '*.AppImage'
            updater_asset: Siffra-linux-x86_64.AppImage
            installer_glob: '*.deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # `-` is codesign's ad-hoc identity. It seals the complete app bundle
          # without claiming a Developer ID or making it trusted by Gatekeeper.
          printf '\n[package.metadata.packager.macos]\nsigning-identity = "-"\n' >> desktop/Cargo.toml

      - name: Package and sign
        env:
          # The public key is compiled into the binary. The private key and its
          # password exist only for this step and only produce detached signatures.
          SIFFRA_UPDATER_PUBLIC_KEY: ${{ vars.SIFFRA_UPDATER_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIFFRA_UPDATER_PUBLIC_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          cargo packager --release --packages siffra-desktop --formats "${{ matrix.formats }}"

      - name: Verify macOS ad-hoc signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/release/bundle -type d -name '*.app' -print -quit)"
          dmg="$(find target/release/bundle -type f -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$dmg"

          # Structural verification catches an unsigned bundle and the invalid
          # linker-only signature that previously produced the "damaged" alert.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"

          app_signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          dmg_signature="$(codesign --display --verbose=4 "$dmg" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"$app_signature"
          grep -q '^Signature=adhoc$' <<<"$dmg_signature"

      - name: Stage installers and the updater package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          updater="$(find target/release/bundle -type f -name "${{ matrix.updater_glob }}" -print -quit)"
          installer="$(find target/release/bundle -type f -name "${{ matrix.installer_glob }}" -print -quit)"
          test -n "$updater"
          test -n "$installer"
          test -f "$updater.sig"
          test -f "$installer.sig"
          cp "$updater" "release/${{ matrix.updater_asset }}"
          cp "$updater.sig" "release/${{ matrix.updater_asset }}.sig"
          cp "$installer" "release/$(basename "$installer")"
          cp "$installer.sig" "release/$(basename "$installer").sig"
          printf '{"platform":"%s","asset":"%s","format":"%s"}\n' \
            '${{ matrix.platform }}' '${{ matrix.updater_asset }}' '${{ matrix.updater_format }}' \
            > release/updater.json

          # Keep the artifact contract narrow: one updater package, one native
          # installer, their detached signatures, and internal manifest data.
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      # Add .github/release-notes/vX.Y.Z.md to override the generated body for
      # that exact tag. The full CHANGELOG.md asset remains generated below.
      - name: Stage custom release notes
        if: ${{ hashFiles(format('.github/release-notes/{0}.md', github.ref_name)) != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp ".github/release-notes/${GITHUB_REF_NAME}.md" release-assets/release-notes.md

      - name: Generate release notes
        if: ${{ hashFiles(format('.github/release-notes/{0}.md', github.ref_name)) == '' }}
        uses: orhun/git-cliff-action@v4
        with:
          args: --config cliff.toml --unreleased --tag ${{ github.ref_name }} --output release-assets/release-notes.md

      - name: Generate the full changelog asset
        uses: orhun/git-cliff-action@v4
        with:
          args: --config cliff.toml --output release-assets/CHANGELOG.md

      - name: Build the signed updater manifest
        shell: bash
        run: |
          chmod +x scripts/create-update-manifest.sh
          scripts/create-update-manifest.sh "$GITHUB_REF_NAME" release-assets

      - name: Create the GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --title "Siffra $GITHUB_REF_NAME" --notes-file release-assets/release-notes.md --draft

          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find release-assets -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.sig' -o \
            -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' -o \
            -name '*.dmg' -o -name '*.dmg.sig' -o \
            -name '*.msi' -o -name '*.msi.sig' -o \
            -name '*.deb' -o -name '*.deb.sig' -o \
            -name latest.json -o -name CHANGELOG.md \
            \) -print0)

          # Four platforms contribute four public artifacts each, followed by
          # the updater manifest and changelog. Refuse to publish anything else.
          test "${#assets[@]}" -eq 18
          for asset in "${assets[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
