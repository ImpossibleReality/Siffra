name: Release

on:
  push:
    tags: ["v*"]

# Release assets are published only after all supported platforms produce a
# minisign-signed updater package. The signature is embedded in latest.json and
# is separate from macOS code signing. Failed releases are safe to rerun: an
# existing draft is reused and assets with the same name are replaced.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev

      - name: Ensure the tag matches the Cargo workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "siffra-desktop") | .version')"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            formats: app
            platform: macos-aarch64
            updater_format: app
            updater_glob: '*.app.tar.gz'
            updater_asset: Siffra-macos-aarch64.app.tar.gz
            installer_glob: '*.app.zip'
          - os: windows-2025
            formats: nsis,wix
            platform: windows-x86_64
            updater_format: nsis
            updater_glob: '*-setup.exe'
            updater_asset: Siffra-windows-x86_64-setup.exe
            installer_glob: '*.msi'
          - os: ubuntu-22.04
            formats: appimage,deb
            platform: linux-x86_64
            updater_format: appimage
            updater_glob: '*.AppImage'
            updater_asset: Siffra-linux-x86_64.AppImage
            installer_glob: '*.deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package and sign
        env:
          # The public key is compiled into the binary. The private key and its
          # password exist only for this step and only produce detached signatures.
          SIFFRA_UPDATER_PUBLIC_KEY: ${{ vars.SIFFRA_UPDATER_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIFFRA_UPDATER_PUBLIC_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          cargo packager --release --packages siffra-desktop --formats "${{ matrix.formats }}"

      - name: Verify and archive the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/release/bundle -type d -name '*.app' -print -quit)"
          test -n "$app"

          # Structural verification catches an unsigned bundle and the invalid
          # linker-only signature that previously produced the "damaged" alert.
          codesign --verify --deep --strict --verbose=2 "$app"
          app_signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"$app_signature"

          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "siffra-desktop") | .version')"
          archive="target/release/bundle/Siffra_${version}_aarch64.app.zip"
          ditto -c -k --keepParent --sequesterRsrc "$app" "$archive"
          unzip -tqq "$archive"

          # Check the distributable rather than only its source bundle. `ditto`
          # preserves the macOS metadata needed by the app after extraction.
          extracted="$(mktemp -d)"
          ditto -x -k "$archive" "$extracted"
          archived_app="$(find "$extracted" -type d -name '*.app' -print -quit)"
          test -n "$archived_app"
          codesign --verify --deep --strict --verbose=2 "$archived_app"
          archived_signature="$(codesign --display --verbose=4 "$archived_app" 2>&1)"
          grep -q '^Signature=adhoc$' <<<"$archived_signature"

      - name: Stage installers and the updater package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          updater="$(find target/release/bundle -type f -name "${{ matrix.updater_glob }}" -print -quit)"
          installer="$(find target/release/bundle -type f -name "${{ matrix.installer_glob }}" -print -quit)"
          test -n "$updater"
          test -n "$installer"
          test -f "$updater.sig"
          cp "$updater" "release/${{ matrix.updater_asset }}"
          cp "$installer" "release/$(basename "$installer")"
          signature="$(<"$updater.sig")"
          jq -n \
            --arg platform '${{ matrix.platform }}' \
            --arg asset '${{ matrix.updater_asset }}' \
            --arg format '${{ matrix.updater_format }}' \
            --arg signature "$signature" \
            '{platform: $platform, asset: $asset, format: $format, signature: $signature}' \
            > release/updater.json

          # Keep the artifact contract narrow: one updater package, one
          # user-facing distribution, and internal manifest signature data.
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      # Add .github/release-notes/vX.Y.Z.md to override the generated body for
      # that exact tag.
      - name: Stage custom release notes
        if: ${{ hashFiles(format('.github/release-notes/{0}.md', github.ref_name)) != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp ".github/release-notes/${GITHUB_REF_NAME}.md" release-assets/release-notes.md

      - name: Generate release notes
        if: ${{ hashFiles(format('.github/release-notes/{0}.md', github.ref_name)) == '' }}
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --output release-assets/release-notes.md

      - name: Build the signed updater manifest
        shell: bash
        run: |
          chmod +x scripts/create-update-manifest.sh
          scripts/create-update-manifest.sh "$GITHUB_REF_NAME" release-assets

      - name: Create the GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find release-assets -type f \( \
            -name '*.AppImage' -o \
            -name '*.app.tar.gz' -o \
            -name '*-setup.exe' -o \
            -name '*.app.zip' -o \
            -name '*.msi' -o \
            -name '*.deb' -o \
            -name latest.json \
            \) -print0)

          # Three platforms contribute two public artifacts each, followed by
          # the updater manifest. Refuse to publish anything else.
          test "${#assets[@]}" -eq 7

          release_args=(
            --title "Siffra $GITHUB_REF_NAME"
            --notes-file release-assets/release-notes.md
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${release_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}" --verify-tag --draft
          fi

          for asset in "${assets[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
