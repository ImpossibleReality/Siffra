[package]
name = "siffra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chumsky = "0.13"
mendeleev = { version = "=0.8.4", default-features = false, features = [
    "atomic_weight",
    "element_list",
    "symbol",
] }
astro-float = { version = "0.9.6", default-features = false, features = [
    "std",
] }
# Dynamic (currency) units: live rates from the Frankfurter API, cached to disk.
# Minimal reqwest: no default features (drops http2/h2, native-tls, system-proxy,
# charset) and `rustls-no-provider` so we supply the lighter `ring` crypto
# provider instead of the large aws-lc-rs C library. JSON is parsed via
# serde_json directly, so the `json` feature isn't needed.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
