[workspace]
resolver = "2"
default-members = ["desktop"]
members = [
    "core",
    "conformance",
    "desktop",
    "wasm",
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Johan Novak <johan@impossiblereality.dev>"]
license = "MIT"
repository = "https://github.com/ImpossibleReality/Siffra"
